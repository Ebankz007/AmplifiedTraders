name: CI

# The gate. A commit that is not green here is never deployed: the server's
# deploy script refuses a red commit (infrastructure/deploy/deploy.sh).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The marketing pages and the blog post routes are PRERENDERED at build
    # time from the database, so the build needs a live Postgres with the
    # schema and the seeded content. CI spins up one and seeds it.
    #
    # Postgres is a SERVICE, not a step: a step-level `uses:` must be
    # owner/repo@ref or docker://image, and `postgres:16` is neither. When
    # that is wrong GitHub rejects the whole workflow file at validation time,
    # which surfaces as a failed run with zero jobs and no annotations.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: amplifiedtraders_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amplifiedtraders_ci?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        run: pnpm db:generate

      # The schema comes BEFORE the tests. tests/wallet/wallet-db.test.ts
      # imports @/lib/prisma, which reads DATABASE_URL at import time and
      # throws if it is missing — so the suite cannot even load without a
      # database, and the `describe.skipIf(!hasDb)` guard in it is unreachable.
      # With DATABASE_URL set (job-level env) and the schema in place, those
      # eleven tests actually RUN in CI instead of silently skipping.
      - name: Apply the schema
        run: pnpm db:deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # The content seed is create-if-absent, so it is safe to re-run and it
      # never overwrites what a previous run wrote.
      - name: Seed the content
        env:
          ADMIN_EMAIL: ci@amplifiedtraders.test
          ADMIN_PASSWORD: ci-not-a-real-password
          ADMIN_NAME: CI Admin
        run: |
          pnpm db:seed
          pnpm db:seed:content

      - name: Assert the content landed
        run: pnpm tsx infrastructure/deploy/assert-content.ts

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3600
        run: pnpm build
